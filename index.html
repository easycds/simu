
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Simulateur Sécurité Routière — v5 (marquages au sol)</title>
<style>
  :root {
    --encre: #1c2430;
    --papier: #eef1f4;
    --accent: #2563eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--papier);
    color: var(--encre);
    display: flex;
    flex-direction: column;
  }
  nav {
    display: flex;
    gap: 4px;
    padding: 8px 14px 0;
    background: #fff;
  }
  nav button {
    border: 1px solid #d8dee6;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 9px 20px;
    background: #e6eaef;
    font-weight: 500;
  }
  nav button.actif { background: #fff; color: var(--accent); }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: #fff;
    border-bottom: 1px solid #d8dee6;
    flex-wrap: wrap;
  }
  header .aide { font-size: 12px; color: #5b6776; width: 100%; }
  .groupe {
    display: flex;
    border: 1px solid #c4cdd8;
    border-radius: 8px;
    overflow: hidden;
  }
  .groupe button, .groupe select { border: none; border-radius: 0; }
  .groupe > * + * { border-left: 1px solid #c4cdd8 !important; }
  button, select {
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid #c4cdd8;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    touch-action: manipulation;
  }
  button.actif { background: var(--accent); border-color: var(--accent); color: #fff; }
  label.controle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 0 4px;
  }
  input[type="range"] { width: 110px; }
  .vue { flex: 1; position: relative; display: flex; flex-direction: column; }
  .vue.cachee { display: none; }
  .zone-canvas { flex: 1; position: relative; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  #canvas-editeur { cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>

<nav>
  <button id="onglet-scene" class="actif">Scène</button>
  <button id="onglet-editeur">Éditeur de routes</button>
</nav>

<!-- ================= VUE SCÈNE ================= -->
<div class="vue" id="vue-scene">
  <header>
    <div class="groupe" id="choix-decor">
      <button data-decor="carrefour" class="actif">Carrefour</button>
      <button data-decor="rondpoint">Rond-point</button>
      <button data-decor="perso" id="btn-decor-perso" hidden>Perso</button>
    </div>
    <button id="btn-vehicule">+ Véhicule</button>
    <button id="btn-pieton">+ Piéton</button>
    <div class="groupe">
      <select id="type-panneau" aria-label="Type de panneau">
        <option value="stop">STOP</option>
        <option value="cedez">Cédez-le-passage</option>
        <option value="sens_interdit">Sens interdit</option>
        <option value="passage_pieton">Passage piéton</option>
        <option value="giratoire">Carrefour giratoire</option>
      </select>
      <button id="btn-panneau">+ Panneau</button>
    </div>
    <button id="btn-angle-mort">Angles morts</button>
    <button id="btn-vider">Vider</button>
    <span class="aide">Glisser : déplacer et orienter · Double-tap véhicule : clignotants · Double-tap panneau : changer le type</span>
  </header>
  <div class="zone-canvas"><canvas id="canvas-scene"></canvas></div>
</div>

<!-- ================= VUE ÉDITEUR ================= -->
<div class="vue cachee" id="vue-editeur">
  <header>
    <div class="groupe" id="choix-mode">
      <button data-mode="route" class="actif">Route</button>
      <button data-mode="marquage">Marquage</button>
    </div>
    <select id="type-marquage" aria-label="Type de marquage" disabled>
      <option value="stop">Ligne STOP</option>
      <option value="cedez">Ligne cédez-le-passage</option>
      <option value="passage_pieton">Passage piéton</option>
      <option value="ligne_discontinue">Ligne discontinue</option>
      <option value="ligne_continue">Ligne continue</option>
    </select>
    <label class="controle">Largeur route
      <input type="range" id="ed-largeur" min="50" max="150" step="10" value="90">
      <span id="ed-largeur-val">90</span>
    </label>
    <label class="controle">
      <input type="checkbox" id="ed-magnetisme" checked> Magnétisme
    </label>
    <button id="ed-terminer">Terminer</button>
    <button id="ed-annuler">Annuler</button>
    <button id="ed-effacer">Tout effacer</button>
    <div class="groupe">
      <button id="ed-exporter">Exporter</button>
      <button id="ed-importer">Importer</button>
    </div>
    <button id="ed-utiliser" class="actif">Utiliser dans la scène →</button>
    <input type="file" id="ed-fichier" accept=".json,application/json" hidden>
    <span class="aide" id="ed-aide">Mode Route : tapez pour poser les points, double-tap ou « Terminer » pour clore. Les routes sont nues : ajoutez les marquages avec le mode Marquage.</span>
  </header>
  <div class="zone-canvas"><canvas id="canvas-editeur"></canvas></div>
</div>

<script>
'use strict';

/* ============================================================
   UTILITAIRES
   ============================================================ */

function lerpAngle(a, b, t) {
  const diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + diff * t;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================================================
   ENTITÉS (inchangées)
   ============================================================ */

class Entity {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.angle = 0; this.angleCible = 0;
    this.rotationAuDrag = true;
    this.enDrag = false;
    this._grabDx = 0; this._grabDy = 0;
  }
  contains() { return false; }
  onDoubleTap() {}
  update() {
    if (this.rotationAuDrag) this.angle = lerpAngle(this.angle, this.angleCible, 0.28);
  }
  draw() {}
}

class Vehicule extends Entity {
  constructor({ x, y, couleur = '#2563eb' }) {
    super(x, y);
    this.couleur = couleur;
    this.longueur = 86; this.largeur = 44;
    this.angle = this.angleCible = -Math.PI / 2;
    this.clignotant = null;
    this.afficherAngleMort = false;
  }
  contains(px, py) {
    const dx = px - this.x, dy = py - this.y;
    const cos = Math.cos(-this.angle), sin = Math.sin(-this.angle);
    const lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
    return Math.abs(lx) <= this.longueur / 2 + 8 && Math.abs(ly) <= this.largeur / 2 + 8;
  }
  onDoubleTap() {
    const ordre = [null, 'droite', 'gauche', 'warning'];
    this.clignotant = ordre[(ordre.indexOf(this.clignotant) + 1) % ordre.length];
  }
  draw(ctx, temps) {
    const L = this.longueur, l = this.largeur;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    if (this.afficherAngleMort) {
      ctx.fillStyle = 'rgba(220, 38, 38, 0.18)';
      ctx.strokeStyle = 'rgba(220, 38, 38, 0.45)';
      ctx.lineWidth = 1;
      for (const c of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(-L * 0.18, c * l / 2);
        ctx.lineTo(-L * 1.6,  c * l * 2.6);
        ctx.lineTo(-L * 0.55, c * l * 2.9);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(ctx, -L/2 + 3, -l/2 + 4, L, l, 10); ctx.fill();
    ctx.fillStyle = this.couleur;
    roundRect(ctx, -L/2, -l/2, L, l, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    roundRect(ctx, L*0.12, -l/2 + 6, L*0.16, l - 12, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    roundRect(ctx, -L*0.34, -l/2 + 7, L*0.10, l - 14, 4); ctx.fill();
    if (this.clignotant && (temps % 800) < 400) {
      ctx.fillStyle = '#f59e0b';
      const pos = [];
      if (this.clignotant !== 'gauche') pos.push([L/2-6, l/2-6], [-L/2+6, l/2-6]);
      if (this.clignotant !== 'droite') pos.push([L/2-6, -l/2+6], [-L/2+6, -l/2+6]);
      for (const [cx, cy] of pos) {
        ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }
}

class Pieton extends Entity {
  constructor({ x, y, couleur = '#0e7490' }) {
    super(x, y);
    this.couleur = couleur;
    this.rayon = 19;
    this.angle = this.angleCible = -Math.PI / 2;
  }
  contains(px, py) { return Math.hypot(px - this.x, py - this.y) <= this.rayon + 12; }
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(2, 3, this.rayon*0.7, this.rayon, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = this.couleur;
    ctx.beginPath(); ctx.ellipse(0, 0, this.rayon*0.7, this.rayon, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#e8c39e';
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(0, s*this.rayon*0.9, 4.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(4, 0, 8.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
  }
}

const TYPES_PANNEAUX = ['stop', 'cedez', 'sens_interdit', 'passage_pieton', 'giratoire'];

class Panneau extends Entity {
  constructor({ x, y, type = 'stop' }) {
    super(x, y);
    this.type = type;
    this.taille = 52;
    this.rotationAuDrag = false;
  }
  contains(px, py) {
    const r = this.taille / 2 + 10;
    return Math.abs(px - this.x) <= r && Math.abs(py - this.y) <= r;
  }
  onDoubleTap() {
    this.type = TYPES_PANNEAUX[(TYPES_PANNEAUX.indexOf(this.type) + 1) % TYPES_PANNEAUX.length];
  }
  draw(ctx) {
    const t = this.taille, r = t / 2;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath(); ctx.ellipse(2, r*0.85, r*0.55, r*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.lineJoin = 'round';
    switch (this.type) {
      case 'stop': {
        ctx.fillStyle = '#c1121f'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3.5;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = Math.PI/8 + i*Math.PI/4;
          const px = r*Math.cos(a), py = r*Math.sin(a);
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.round(t*0.30)}px system-ui, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('STOP', 0, 1);
        break;
      }
      case 'cedez': {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c1121f'; ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(0, r); ctx.lineTo(-r*0.95, -r*0.62); ctx.lineTo(r*0.95, -r*0.62);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        break;
      }
      case 'sens_interdit': {
        ctx.fillStyle = '#c1121f'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        roundRect(ctx, -r*0.62, -r*0.16, r*1.24, r*0.32, 3); ctx.fill();
        break;
      }
      case 'passage_pieton': {
        ctx.fillStyle = '#1d4ed8'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
        roundRect(ctx, -r, -r, t, t, 6); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(0, -r*0.72); ctx.lineTo(-r*0.74, r*0.62); ctx.lineTo(r*0.74, r*0.62);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#1c2430'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-2, -r*0.05); ctx.lineTo(0, r*0.2);
        ctx.moveTo(0, r*0.2); ctx.lineTo(-6, r*0.5);
        ctx.moveTo(0, r*0.2); ctx.lineTo(6, r*0.5);
        ctx.stroke();
        ctx.fillStyle = '#1c2430';
        ctx.beginPath(); ctx.arc(-2, -r*0.18, 3.4, 0, Math.PI*2); ctx.fill();
        break;
      }
      case 'giratoire': {
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c1121f'; ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(0, -r); ctx.lineTo(-r*0.95, r*0.62); ctx.lineTo(r*0.95, r*0.62);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#1c2430'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        const rc = r*0.32, cy0 = r*0.12;
        for (let k = 0; k < 3; k++) {
          const a0 = -Math.PI/2 + k*(2*Math.PI/3) + 0.35;
          const a1 = a0 + 2*Math.PI/3 - 0.7;
          ctx.beginPath(); ctx.arc(0, cy0, rc, a1, a0); ctx.stroke();
          const fx = rc*Math.cos(a1), fy = cy0 + rc*Math.sin(a1);
          ctx.save();
          ctx.translate(fx, fy); ctx.rotate(a1 - Math.PI/2);
          ctx.beginPath();
          ctx.moveTo(4, 0); ctx.lineTo(-3, -3.5); ctx.lineTo(-3, 3.5);
          ctx.closePath(); ctx.fillStyle = '#1c2430'; ctx.fill();
          ctx.restore();
        }
        break;
      }
    }
    ctx.restore();
  }
}

/* ============================================================
   DÉCORS FIXES (inchangés)
   ============================================================ */

function drawCarrefour(ctx, W, H) {
  const ROUTE = 180, r = ROUTE / 2;
  ctx.fillStyle = '#9ec79b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#565d66';
  ctx.fillRect(0, H/2 - r, W, ROUTE);
  ctx.fillRect(W/2 - r, 0, ROUTE, H);
  ctx.strokeStyle = '#d9dde2'; ctx.lineWidth = 5;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(sx > 0 ? W : 0, H/2 + sy*r);
    ctx.lineTo(W/2 + sx*r, H/2 + sy*r);
    ctx.lineTo(W/2 + sx*r, sy > 0 ? H : 0);
    ctx.stroke();
  }
  ctx.strokeStyle = '#f3f4f6'; ctx.lineWidth = 4; ctx.setLineDash([26, 22]);
  ctx.beginPath();
  ctx.moveTo(0, H/2); ctx.lineTo(W/2 - r, H/2);
  ctx.moveTo(W/2 + r, H/2); ctx.lineTo(W, H/2);
  ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H/2 - r);
  ctx.moveTo(W/2, H/2 + r); ctx.lineTo(W/2, H);
  ctx.stroke(); ctx.setLineDash([]);
}

function drawRondPoint(ctx, W, H) {
  const cx = W/2, cy = H/2;
  const ROUTE = 170, r = ROUTE / 2;
  const Rext = Math.min(W, H) * 0.30, Rint = Rext * 0.52, Rmil = (Rext + Rint) / 2;
  const dx = Math.sqrt(Rext*Rext - r*r), theta = Math.asin(r / Rext);
  ctx.fillStyle = '#9ec79b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#565d66';
  ctx.fillRect(0, cy - r, W, ROUTE);
  ctx.fillRect(cx - r, 0, ROUTE, H);
  ctx.beginPath(); ctx.arc(cx, cy, Rext, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#d9dde2'; ctx.lineWidth = 5;
  ctx.beginPath();
  for (const s of [-1, 1]) {
    ctx.moveTo(0, cy + s*r); ctx.lineTo(cx - dx, cy + s*r);
    ctx.moveTo(W, cy + s*r); ctx.lineTo(cx + dx, cy + s*r);
    ctx.moveTo(cx + s*r, 0); ctx.lineTo(cx + s*r, cy - dx);
    ctx.moveTo(cx + s*r, H); ctx.lineTo(cx + s*r, cy + dx);
  }
  ctx.stroke();
  ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    const a0 = k*Math.PI/2 + theta, a1 = (k+1)*Math.PI/2 - theta;
    ctx.moveTo(cx + Rext*Math.cos(a0), cy + Rext*Math.sin(a0));
    ctx.arc(cx, cy, Rext, a0, a1);
  }
  ctx.stroke();
  ctx.fillStyle = '#9ec79b';
  ctx.beginPath(); ctx.arc(cx, cy, Rint, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#d9dde2'; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = '#7fb37c';
  ctx.beginPath(); ctx.arc(cx, cy, Rint*0.62, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#f3f4f6'; ctx.lineWidth = 4; ctx.setLineDash([26, 22]);
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(cx - Rext, cy);
  ctx.moveTo(W, cy); ctx.lineTo(cx + Rext, cy);
  ctx.moveTo(cx, 0); ctx.lineTo(cx, cy - Rext);
  ctx.moveTo(cx, H); ctx.lineTo(cx, cy + Rext);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#f3f4f6'; ctx.lineWidth = 7; ctx.setLineDash([14, 10]);
  for (let k = 0; k < 4; k++) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(k*Math.PI/2);
    ctx.beginPath(); ctx.moveTo(4, dx + 4); ctx.lineTo(r - 4, dx + 4); ctx.stroke();
    ctx.restore();
  }
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(243, 244, 246, 0.9)';
  for (let k = 0; k < 4; k++) {
    const a = k*Math.PI/2 + Math.PI/4;
    ctx.save();
    ctx.translate(cx + Rmil*Math.cos(a), cy + Rmil*Math.sin(a));
    ctx.rotate(a - Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(12, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, 0); ctx.lineTo(-8, 9);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

/* ============================================================
   ÉDITEUR : routes nues + marquages au sol
   ------------------------------------------------------------
   - routes    : [{ pts: [{x,y} normalisés], largeur }]
   - marquages : [{ type, pts: [{x,y} normalisés] }]
       · stop / cedez / passage_pieton : exactement 2 points
         (posés de part et d'autre de la chaussée)
       · ligne_continue / ligne_discontinue : polyligne libre
   ============================================================ */

const MARQUAGES_2_POINTS = ['stop', 'cedez', 'passage_pieton'];

const editeur = {
  mode: 'route',            // 'route' | 'marquage'
  typeMarquage: 'stop',
  routes: [],
  marquages: [],
  enCoursRoute: null,
  enCoursMarquage: null,
  largeur: 90,
  magnetisme: true,
  curseur: null,
};
const GRILLE = 20;

function tracerChemin(ctx, pts, W, H) {
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = p.x * W, y = p.y * H;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
}

/* --- Rendu d'UN marquage --- */
function drawMarquage(ctx, m, W, H, alpha = 1) {
  if (m.pts.length < 2) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#f3f4f6';
  ctx.fillStyle = '#f3f4f6';
  ctx.lineJoin = 'round';

  switch (m.type) {

    case 'stop': {            // bande continue épaisse (50 cm réels)
      ctx.lineWidth = 12;
      ctx.lineCap = 'butt';
      tracerChemin(ctx, m.pts.slice(0, 2), W, H);
      ctx.stroke();
      break;
    }

    case 'cedez': {           // bande discontinue épaisse
      ctx.lineWidth = 12;
      ctx.lineCap = 'butt';
      ctx.setLineDash([16, 12]);
      tracerChemin(ctx, m.pts.slice(0, 2), W, H);
      ctx.stroke();
      ctx.setLineDash([]);
      break;
    }

    case 'passage_pieton': {  // bandes zébrées le long du trajet piéton,
                              // chaque bande allongée dans le sens des véhicules
      const a = { x: m.pts[0].x * W, y: m.pts[0].y * H };
      const b = { x: m.pts[1].x * W, y: m.pts[1].y * H };
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      if (len < 4) break;
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      const BANDE = 16, ECART = 16, DEMI_LONG = 30;  // dimensions des zébrures
      const pas = BANDE + ECART;
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(angle);                // axe x local = trajet du piéton
      for (let d = ECART / 2; d + BANDE <= len; d += pas) {
        ctx.fillRect(d, -DEMI_LONG, BANDE, DEMI_LONG * 2);
      }
      ctx.restore();
      break;
    }

    case 'ligne_continue': {
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      tracerChemin(ctx, m.pts, W, H);
      ctx.stroke();
      break;
    }

    case 'ligne_discontinue': {
      ctx.lineWidth = 4;
      ctx.lineCap = 'butt';
      ctx.setLineDash([26, 22]);
      tracerChemin(ctx, m.pts, W, H);
      ctx.stroke();
      ctx.setLineDash([]);
      break;
    }
  }
  ctx.restore();
}

/* --- Rendu complet : routes NUES puis marquages par-dessus --- */
function drawCartePerso(ctx, W, H, routes, marquages, apercu) {
  ctx.fillStyle = '#9ec79b';
  ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // PASSE 1 — bordures de toutes les routes
  ctx.strokeStyle = '#d9dde2';
  for (const rt of routes) {
    if (rt.pts.length < 2) continue;
    ctx.lineWidth = rt.largeur + 10;
    tracerChemin(ctx, rt.pts, W, H);
    ctx.stroke();
  }
  // PASSE 2 — asphalte (aucun marquage automatique)
  ctx.strokeStyle = '#565d66';
  for (const rt of routes) {
    if (rt.pts.length < 2) continue;
    ctx.lineWidth = rt.largeur;
    tracerChemin(ctx, rt.pts, W, H);
    ctx.stroke();
  }
  // PASSE 3 — marquages posés par le formateur
  for (const m of marquages) drawMarquage(ctx, m, W, H);

  // --- Aperçus (éditeur uniquement) ---
  if (!apercu) return;

  if (apercu.route && apercu.route.pts.length > 0) {
    const pts = apercu.route.pts.slice();
    if (apercu.curseur) pts.push(apercu.curseur);
    if (pts.length >= 2) {
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = '#565d66';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.lineWidth = apercu.route.largeur;
      tracerChemin(ctx, pts, W, H);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#2563eb';
    for (const p of apercu.route.pts) {
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 6, 0, Math.PI * 2); ctx.fill();
    }
  }

  if (apercu.marquage && apercu.marquage.pts.length > 0) {
    const m = { type: apercu.marquage.type, pts: apercu.marquage.pts.slice() };
    if (apercu.curseur) m.pts.push(apercu.curseur);
    drawMarquage(ctx, m, W, H, 0.55);
    ctx.fillStyle = '#16a34a';
    for (const p of apercu.marquage.pts) {
      ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 6, 0, Math.PI * 2); ctx.fill();
    }
  }
}

const DECORS = {
  carrefour: drawCarrefour,
  rondpoint: drawRondPoint,
  perso: (ctx, W, H) => drawCartePerso(ctx, W, H, editeur.routes, editeur.marquages, null),
};
let decorActif = 'carrefour';

/* ============================================================
   CANVAS scène + éditeur
   ============================================================ */

function creerCanvas(id) {
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  const etat = { canvas, ctx, W: 0, H: 0 };
  etat.resize = () => {
    const rect = canvas.parentElement.getBoundingClientRect();
    if (rect.width === 0) return;
    const dpr = window.devicePixelRatio || 1;
    etat.W = rect.width;
    etat.H = rect.height;
    canvas.width  = Math.round(etat.W * dpr);
    canvas.height = Math.round(etat.H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  etat.resize();
  return etat;
}

const sc = creerCanvas('canvas-scene');
const ed = creerCanvas('canvas-editeur');
window.addEventListener('resize', () => { sc.resize(); ed.resize(); });

/* ============================================================
   ONGLETS
   ============================================================ */

let ongletActif = 'scene';
const vues = { scene: document.getElementById('vue-scene'), editeur: document.getElementById('vue-editeur') };

function activerOnglet(nom) {
  ongletActif = nom;
  vues.scene.classList.toggle('cachee', nom !== 'scene');
  vues.editeur.classList.toggle('cachee', nom !== 'editeur');
  document.getElementById('onglet-scene').classList.toggle('actif', nom === 'scene');
  document.getElementById('onglet-editeur').classList.toggle('actif', nom === 'editeur');
  requestAnimationFrame(() => { sc.resize(); ed.resize(); });
}
document.getElementById('onglet-scene').addEventListener('click', () => activerOnglet('scene'));
document.getElementById('onglet-editeur').addEventListener('click', () => activerOnglet('editeur'));

/* ============================================================
   BOUCLE DE RENDU
   ============================================================ */

const couleursVehicules = ['#2563eb', '#dc2626', '#16a34a', '#7c3aed', '#ea580c'];
const couleursPietons   = ['#0e7490', '#b45309', '#4d7c0f', '#9d174d'];

let entites = [
  new Vehicule({ x: sc.W / 2 + 46, y: sc.H * 0.82, couleur: couleursVehicules[0] }),
  new Vehicule({ x: sc.W * 0.15,  y: sc.H / 2 + 46, couleur: couleursVehicules[1] }),
];
entites[1].angle = entites[1].angleCible = 0;
let nbVehicules = 2, nbPietons = 0;

function boucle(temps) {
  if (ongletActif === 'scene') {
    for (const e of entites) e.update();
    DECORS[decorActif](sc.ctx, sc.W, sc.H);
    for (const e of entites) e.draw(sc.ctx, temps);
  } else {
    drawCartePerso(ed.ctx, ed.W, ed.H, editeur.routes, editeur.marquages, {
      route: editeur.mode === 'route' ? editeur.enCoursRoute : null,
      marquage: editeur.mode === 'marquage' ? editeur.enCoursMarquage : null,
      curseur: editeur.curseur,
    });
  }
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

/* ============================================================
   INTERACTIONS SCÈNE
   ============================================================ */

let actif = null;
let dernierTap = { t: 0, x: 0, y: 0, cible: null };
const SEUIL_ROTATION = 4;

function pointDans(etat, e) {
  const r = etat.canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

sc.canvas.addEventListener('pointerdown', (e) => {
  const p = pointDans(sc, e);
  let touche = null;
  for (let i = entites.length - 1; i >= 0; i--) {
    if (entites[i].contains(p.x, p.y)) { touche = entites[i]; break; }
  }
  const maintenant = performance.now();
  const estDoubleTap = touche && touche === dernierTap.cible &&
    maintenant - dernierTap.t < 350 &&
    Math.hypot(p.x - dernierTap.x, p.y - dernierTap.y) < 30;
  if (estDoubleTap) {
    touche.onDoubleTap();
    dernierTap = { t: 0, x: 0, y: 0, cible: null };
    return;
  }
  dernierTap = { t: maintenant, x: p.x, y: p.y, cible: touche };
  if (!touche) return;
  entites.splice(entites.indexOf(touche), 1);
  entites.push(touche);
  actif = touche;
  actif.enDrag = true;
  actif._grabDx = p.x - actif.x;
  actif._grabDy = p.y - actif.y;
  sc.canvas.setPointerCapture(e.pointerId);
  sc.canvas.classList.add('dragging');
});

sc.canvas.addEventListener('pointermove', (e) => {
  if (!actif) return;
  const p = pointDans(sc, e);
  const nx = p.x - actif._grabDx, ny = p.y - actif._grabDy;
  if (actif.rotationAuDrag) {
    const dx = nx - actif.x, dy = ny - actif.y;
    if (Math.hypot(dx, dy) > SEUIL_ROTATION) {
      actif.angleCible = Math.atan2(dy, dx);   // OPTION A
    }
  }
  actif.x = nx; actif.y = ny;
});

function finDrag() {
  if (!actif) return;
  actif.enDrag = false;
  actif = null;
  sc.canvas.classList.remove('dragging');
}
sc.canvas.addEventListener('pointerup', finDrag);
sc.canvas.addEventListener('pointercancel', finDrag);

/* ============================================================
   INTERACTIONS ÉDITEUR — deux modes
   ============================================================ */

let dernierTapEd = { t: 0, x: 0, y: 0 };

function pointEditeur(e) {
  let p = pointDans(ed, e);
  if (editeur.magnetisme) {
    p = { x: Math.round(p.x / GRILLE) * GRILLE, y: Math.round(p.y / GRILLE) * GRILLE };
  }
  return p;
}

function terminerTrace() {
  if (editeur.enCoursRoute && editeur.enCoursRoute.pts.length >= 2) {
    editeur.routes.push(editeur.enCoursRoute);
  }
  editeur.enCoursRoute = null;
  if (editeur.enCoursMarquage && editeur.enCoursMarquage.pts.length >= 2) {
    editeur.marquages.push(editeur.enCoursMarquage);
  }
  editeur.enCoursMarquage = null;
  majBoutonPerso();
}

ed.canvas.addEventListener('pointerdown', (e) => {
  const p = pointEditeur(e);
  const pn = { x: p.x / ed.W, y: p.y / ed.H };
  const deuxPoints = editeur.mode === 'marquage' &&
                     MARQUAGES_2_POINTS.includes(editeur.typeMarquage);

  // Double-tap = clore (uniquement pour les tracés en polyligne)
  if (!deuxPoints) {
    const maintenant = performance.now();
    if (maintenant - dernierTapEd.t < 350 &&
        Math.hypot(p.x - dernierTapEd.x, p.y - dernierTapEd.y) < 30) {
      terminerTrace();
      dernierTapEd = { t: 0, x: 0, y: 0 };
      return;
    }
    dernierTapEd = { t: maintenant, x: p.x, y: p.y };
  }

  if (editeur.mode === 'route') {
    if (!editeur.enCoursRoute) {
      editeur.enCoursRoute = { pts: [], largeur: editeur.largeur };
    }
    editeur.enCoursRoute.pts.push(pn);
    return;
  }

  // Mode marquage
  if (!editeur.enCoursMarquage) {
    editeur.enCoursMarquage = { type: editeur.typeMarquage, pts: [] };
  }
  editeur.enCoursMarquage.pts.push(pn);

  // Les marquages transversaux se terminent d'eux-mêmes au 2e point
  if (deuxPoints && editeur.enCoursMarquage.pts.length === 2) {
    terminerTrace();
  }
});

ed.canvas.addEventListener('pointermove', (e) => {
  const p = pointEditeur(e);
  editeur.curseur = { x: p.x / ed.W, y: p.y / ed.H };
});
ed.canvas.addEventListener('pointerleave', () => { editeur.curseur = null; });

/* ============================================================
   BARRE D'OUTILS ÉDITEUR
   ============================================================ */

const btnDecorPerso = document.getElementById('btn-decor-perso');
function majBoutonPerso() {
  btnDecorPerso.hidden = editeur.routes.length === 0 && editeur.marquages.length === 0;
}

const selectMarquage = document.getElementById('type-marquage');
const aideEditeur = document.getElementById('ed-aide');

document.getElementById('choix-mode').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  terminerTrace();                       // on clôt le tracé en cours avant de changer
  editeur.mode = btn.dataset.mode;
  for (const b of document.querySelectorAll('#choix-mode button')) {
    b.classList.toggle('actif', b === btn);
  }
  selectMarquage.disabled = editeur.mode !== 'marquage';
  aideEditeur.textContent = editeur.mode === 'route'
    ? 'Mode Route : tapez pour poser les points, double-tap ou « Terminer » pour clore. Les routes sont nues : ajoutez les marquages avec le mode Marquage.'
    : 'Mode Marquage : STOP, cédez et passage piéton se posent en 2 taps (un de chaque côté de la chaussée). Les lignes se tracent en polyligne, double-tap pour clore.';
});

selectMarquage.addEventListener('change', () => {
  terminerTrace();
  editeur.typeMarquage = selectMarquage.value;
});

const sliderLargeur = document.getElementById('ed-largeur');
sliderLargeur.addEventListener('input', () => {
  editeur.largeur = Number(sliderLargeur.value);
  document.getElementById('ed-largeur-val').textContent = sliderLargeur.value;
  if (editeur.enCoursRoute) editeur.enCoursRoute.largeur = editeur.largeur;
});

document.getElementById('ed-magnetisme').addEventListener('change', (e) => {
  editeur.magnetisme = e.target.checked;
});

document.getElementById('ed-terminer').addEventListener('click', terminerTrace);

document.getElementById('ed-annuler').addEventListener('click', () => {
  // Annulation contextuelle : tracé en cours, sinon dernier élément du mode actif
  if (editeur.mode === 'route') {
    if (editeur.enCoursRoute && editeur.enCoursRoute.pts.length > 0) {
      editeur.enCoursRoute.pts.pop();
      if (editeur.enCoursRoute.pts.length === 0) editeur.enCoursRoute = null;
    } else if (editeur.routes.length > 0) {
      editeur.routes.pop();
    }
  } else {
    if (editeur.enCoursMarquage && editeur.enCoursMarquage.pts.length > 0) {
      editeur.enCoursMarquage.pts.pop();
      if (editeur.enCoursMarquage.pts.length === 0) editeur.enCoursMarquage = null;
    } else if (editeur.marquages.length > 0) {
      editeur.marquages.pop();
    }
  }
  majBoutonPerso();
});

document.getElementById('ed-effacer').addEventListener('click', () => {
  editeur.routes = [];
  editeur.marquages = [];
  editeur.enCoursRoute = null;
  editeur.enCoursMarquage = null;
  majBoutonPerso();
  if (decorActif === 'perso') choisirDecor('carrefour');
});

document.getElementById('ed-exporter').addEventListener('click', () => {
  terminerTrace();
  const blob = new Blob(
    [JSON.stringify({ version: 2, routes: editeur.routes, marquages: editeur.marquages }, null, 2)],
    { type: 'application/json' }
  );
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ma-carte.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

const inputFichier = document.getElementById('ed-fichier');
document.getElementById('ed-importer').addEventListener('click', () => inputFichier.click());
inputFichier.addEventListener('change', async () => {
  const fichier = inputFichier.files[0];
  if (!fichier) return;
  try {
    const data = JSON.parse(await fichier.text());
    if (Array.isArray(data.routes)) {
      editeur.routes = data.routes;
      editeur.marquages = Array.isArray(data.marquages) ? data.marquages : [];
      majBoutonPerso();
    }
  } catch {
    alert('Fichier invalide : choisissez un export JSON du simulateur.');
  }
  inputFichier.value = '';
});

document.getElementById('ed-utiliser').addEventListener('click', () => {
  terminerTrace();
  if (editeur.routes.length === 0 && editeur.marquages.length === 0) return;
  choisirDecor('perso');
  activerOnglet('scene');
});

/* ============================================================
   BARRE D'OUTILS SCÈNE
   ============================================================ */

function choisirDecor(nom) {
  decorActif = nom;
  for (const b of document.querySelectorAll('#choix-decor button')) {
    b.classList.toggle('actif', b.dataset.decor === nom);
  }
}

document.getElementById('choix-decor').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-decor]');
  if (btn) choisirDecor(btn.dataset.decor);
});

document.getElementById('btn-vehicule').addEventListener('click', () => {
  entites.push(new Vehicule({
    x: sc.W / 2 + (Math.random() - 0.5) * 120,
    y: sc.H * 0.85,
    couleur: couleursVehicules[nbVehicules++ % couleursVehicules.length],
  }));
});

document.getElementById('btn-pieton').addEventListener('click', () => {
  entites.push(new Pieton({
    x: sc.W * 0.5 + (Math.random() - 0.5) * 160,
    y: sc.H * 0.18,
    couleur: couleursPietons[nbPietons++ % couleursPietons.length],
  }));
});

document.getElementById('btn-panneau').addEventListener('click', () => {
  entites.push(new Panneau({
    x: sc.W * 0.5 + (Math.random() - 0.5) * 160,
    y: sc.H * 0.3,
    type: document.getElementById('type-panneau').value,
  }));
});

const btnAngleMort = document.getElementById('btn-angle-mort');
btnAngleMort.addEventListener('click', () => {
  const cibles = entites.filter(e => e instanceof Vehicule);
  const etat = !cibles.some(v => v.afficherAngleMort);
  for (const v of cibles) v.afficherAngleMort = etat;
  btnAngleMort.classList.toggle('actif', etat);
});

document.getElementById('btn-vider').addEventListener('click', () => {
  entites = [];
  nbVehicules = 0;
  nbPietons = 0;
  btnAngleMort.classList.remove('actif');
});
</script>
